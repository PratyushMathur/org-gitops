    app.kubernetes.io/component: "web"
    app.kubernetes.io/part-of: "canary"
    team: platform
  annotations:
    owner: sre@example.com
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canary-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
