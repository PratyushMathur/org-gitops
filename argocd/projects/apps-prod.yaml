apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-prod
  namespace: argocd
spec:
  description: Application workloads in production.

  sourceRepos:
    - https://github.com/PratyushMathur/org-gitops.git

  # Matched by cluster name, which is what the ApplicationSet puts in
  # destination.name. env=prod is how clusters are discovered; this list is what
  # they are authorised for, so adding a prod cluster is deliberately two steps.
  # Replace with a single `- name: "*"` to let the label alone suffice.
  destinations:
    - name: cluster-a
      namespace: "*"
    - name: cluster-b
      namespace: "*"
    # The Argo CD control plane's own cluster, currently labelled env=prod. Without
    # this entry its generated Applications are refused as "not permitted in
    # project". Drop it once the workload clusters are registered by name.
    - name: in-cluster
      namespace: "*"

  # Namespace is the only cluster-scoped kind allowed, so an app chart cannot grant
  # itself cluster RBAC or install a CRD. See platform-prod.yaml.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true

  # No RBAC role attached: it needs real group names. Add one here (or bind the
  # project in argocd-rbac-cm) to gate who can run a prod sync.
