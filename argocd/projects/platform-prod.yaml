apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-prod
  namespace: argocd
spec:
  description: >-
    Cluster-scoped platform components in production — controllers and their
    CRDs, not application workloads.

  sourceRepos:
    - https://github.com/PratyushMathur/org-gitops.git

  # Same list as apps-prod.
  destinations:
    - name: cluster-a
      namespace: "*"
    - name: cluster-b
      namespace: "*"
    - name: in-cluster
      namespace: "*"

  # The reason this project exists: a controller needs to install CRDs and cluster
  # RBAC, which apps-prod forbids. It gets its own project rather than widening the
  # one every application runs under.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true
