apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-staging
  namespace: argocd
spec:
  goTemplate: true
  # Fail loudly on a typo'd key in a config.yaml rather than rendering an empty
  # string into a namespace or project name.
  goTemplateOptions: ["missingkey=error"]

  # Every registered app x every staging cluster. Same shape as apps-prod, so
  # adding a second staging cluster needs no change here - just the label.
  generators:
    - matrix:
        generators:
          # Clusters are found by label on their Argo CD cluster Secret, never
          # by hardcoded API URL:
          #   argocd cluster add <context> --name cluster-s --label env=staging
          - clusters:
              selector:
                matchLabels:
                  env: staging
          - git:
              repoURL: https://github.com/PratyushMathur/org-gitops.git
              revision: HEAD
              files:
                - path: "environments/staging/*/config.yaml"

  template:
    metadata:
      name: "{{.app}}-{{.env}}-{{.nameNormalized}}"
      labels:
        app.kubernetes.io/name: "{{.app}}"
        app.kubernetes.io/part-of: org-gitops
        env: "{{.env}}"
        cluster: "{{.nameNormalized}}"
      finalizers:
        # Deleting the Application cascades to its resources. Safe in staging;
        # deliberately absent from the prod set.
        - resources-finalizer.argocd.argoproj.io
    spec:
      # .argoProject, not .project: the clusters generator emits its own empty
      # `project` param that would otherwise shadow the value from config.yaml.
      project: "{{.argoProject}}"

      sources:
        # The chart. Its values.yaml holds the app-wide defaults; the env files
        # below layer on top.
        - repoURL: https://github.com/PratyushMathur/org-gitops.git
          targetRevision: HEAD
          path: "{{.chartPath}}"
          helm:
            releaseName: "{{.app}}"
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/{{.env}}/{{.app}}/values.yaml
              - $values/environments/{{.env}}/{{.app}}/values-{{.nameNormalized}}.yaml
        # Second source exists only to expose the repo as $values above, so the
        # env overrides can live outside the chart directory.
        - repoURL: https://github.com/PratyushMathur/org-gitops.git
          targetRevision: HEAD
          ref: values

      destination:
        # Cluster comes from the generator, not from config.yaml.
        name: "{{.name}}"
        namespace: "{{.namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

      revisionHistoryLimit: 5
