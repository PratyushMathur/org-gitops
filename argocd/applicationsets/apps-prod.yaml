# Production ApplicationSet: every registered app x every cluster labelled
# env=prod. Kept separate from other environments so prod's sync policy
# differences stay explicit.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Deleting this ApplicationSet must leave running workloads alone.
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          # Clusters are found by label on their Argo CD cluster Secret, never by
          # hardcoded API URL:
          #   argocd cluster add <context> --name cluster-a --label env=prod
          - clusters:
              selector:
                matchLabels:
                  env: prod
          - git:
              repoURL: https://github.com/PratyushMathur/org-gitops.git
              revision: HEAD
              files:
                - path: "environments/prod/*/config.yaml"

  template:
    metadata:
      # Unique per cluster: company-prod-cluster-a, company-prod-cluster-b
      name: "{{.app}}-{{.env}}-{{.nameNormalized}}"
      labels:
        app.kubernetes.io/name: "{{.app}}"
        app.kubernetes.io/part-of: org-gitops
        env: "{{.env}}"
        cluster: "{{.nameNormalized}}"
      annotations:
        # Diff via a server-side apply dry-run instead of comparing rendered YAML
        # field by field. Without it, anything the API server defaults reads as
        # permanent drift that no sync can fix. Needs ServerSideApply below.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
      # No resources-finalizer: deleting a prod Application must not cascade.
    spec:
      # .argoProject, not .project: the clusters generator emits an empty
      # `project` param that would otherwise shadow config.yaml's value.
      project: "{{.argoProject}}"

      sources:
        - repoURL: https://github.com/PratyushMathur/org-gitops.git
          targetRevision: HEAD
          path: "{{.chartPath}}"
          helm:
            releaseName: "{{.app}}"
            ignoreMissingValueFiles: true
            # Keyed on the cluster Secret's `region` label, not its name: the name
            # is an operational detail, the region is what the overrides describe.
            # `index` rather than .metadata.labels.region so an unlabelled cluster
            # yields "none" instead of tripping missingkey=error.
            valueFiles:
              - $values/environments/{{.env}}/{{.app}}/overrides-{{ index .metadata.labels "region" | default "none" }}.yaml
        # Exists only to expose the repo as $values above, so the per-region
        # overrides can live outside the chart directory.
        - repoURL: https://github.com/PratyushMathur/org-gitops.git
          targetRevision: HEAD
          ref: values

      destination:
        name: "{{.name}}"
        namespace: "{{.namespace}}"

      ignoreDifferences:
        # Argo Rollouts injects `rollouts-pod-template-hash` into the stable and
        # canary Service selectors — that is the traffic-splitting mechanism, and
        # no chart declares it, so a sync would strip it back out.
        - group: ""
          kind: Service
          managedFieldsManagers:
            - rollouts-controller
        # The Gateway API plugin rewrites the HTTPRoute's backendRefs weights to
        # shift traffic. Without this, every canary reads as drift and selfHeal
        # below would revert the split the controller just wrote.
        #
        # Both are scoped by field manager, not path, so charts that are not
        # Rollouts still diff these fields normally.
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          managedFieldsManagers:
            - gatewayAPI

      # No `automated` here: it is added per app by templatePatch below, because
      # `automated` cannot be switched off with field values (an empty
      # `automated: {}` still enables auto-sync) and `template` is a structured
      # CRD field, so a conditional around a key is not possible in it.
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

      revisionHistoryLimit: 10

  # Auto-sync per app, from `autoSync` in environments/prod/<app>/config.yaml. On
  # for company and employee; off for gateway, regional-data and argo-rollouts.
  # Every config.yaml must set the key — with missingkey=error, an app that omits
  # it fails to render rather than silently defaulting to unattended prod syncs.
  #
  # Auto-sync starts the canary, it does not finish it: India opens at 20%, the US
  # at 5%, and neither advances past its first step without
  #   kubectl argo rollouts promote <app> -n demo
  #
  # prune stays off so a resource vanishing from a chart cannot delete a running
  # prod workload. selfHeal reverts manual kubectl edits; the ignoreDifferences
  # above are what stop it fighting the Rollouts controller.
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
    {{- end }}
