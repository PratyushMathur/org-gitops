# Production gets its own ApplicationSet rather than sharing one with other
# environments. That keeps the sync policy differences explicit instead of hidden
# in template overrides, and means prod rollouts can be paused or rolled back by
# touching a single object.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # If this ApplicationSet is ever deleted, leave the running workloads alone.
  syncPolicy:
    preserveResourcesOnDeletion: true

  # Every registered app x every prod cluster. Today that is cluster-a and
  # cluster-b; labelling a third cluster env=prod is enough to roll every app
  # onto it (it also has to be added to the apps-prod AppProject destinations).
  generators:
    - matrix:
        generators:
          # Clusters are found by label on their Argo CD cluster Secret, never
          # by hardcoded API URL:
          #   argocd cluster add <context> --name cluster-a --label env=prod
          - clusters:
              selector:
                matchLabels:
                  env: prod
          - git:
              repoURL: https://github.com/PratyushMathur/org-gitops.git
              revision: HEAD
              files:
                - path: "environments/prod/*/config.yaml"

  template:
    metadata:
      # Unique per cluster: company-prod-cluster-a, company-prod-cluster-b
      name: "{{.app}}-{{.env}}-{{.nameNormalized}}"
      labels:
        app.kubernetes.io/name: "{{.app}}"
        app.kubernetes.io/part-of: org-gitops
        env: "{{.env}}"
        cluster: "{{.nameNormalized}}"
      annotations:
        # Diff by asking the API server what the manifest would actually change
        # (a server-side apply dry-run), instead of comparing our rendered YAML
        # against the stored object field by field.
        #
        # Without this, anything the API server defaults reads as drift forever:
        # the HTTPRoutes came back OutOfSync on `group: ""`, `kind: Service` and
        # `weight: 1` inside backendRefs, and regional-data on StatefulSet
        # defaults — none of which any chart writes, and none of which a sync
        # can fix, so `Synced` stops meaning anything. `kubectl diff` reported no
        # change for all three, which is precisely the comparison this turns on.
        #
        # Needs ServerSideApply, set in syncPolicy.syncOptions below.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
      # No resources-finalizer: deleting a prod Application must not cascade.
    spec:
      # .argoProject, not .project: the clusters generator emits its own empty
      # `project` param that would otherwise shadow the value from config.yaml.
      project: "{{.argoProject}}"

      sources:
        - repoURL: https://github.com/PratyushMathur/org-gitops.git
          targetRevision: HEAD
          path: "{{.chartPath}}"
          helm:
            releaseName: "{{.app}}"
            # The per-region file is optional - a region with nothing to override
            # needs nothing beyond the chart's values.yaml.
            ignoreMissingValueFiles: true
            # Keyed on the cluster Secret's `region` label, NOT on the cluster
            # name: the name is an operational detail (the control plane is
            # always `in-cluster`), while the region is what the overrides
            # actually describe. `index` rather than .metadata.labels.region so
            # an unlabelled cluster yields "none" instead of tripping
            # missingkey=error; overrides-none.yaml does not exist and is
            # skipped.
            #
            # Label a cluster with:
            #   argocd cluster add <ctx> --name <n> --label env=prod --label region=us
            valueFiles:
              - $values/environments/{{.env}}/{{.app}}/overrides-{{ index .metadata.labels "region" | default "none" }}.yaml
        # Second source exists only to expose the repo as $values above, so the
        # per-region overrides can live outside the chart directory.
        - repoURL: https://github.com/PratyushMathur/org-gitops.git
          targetRevision: HEAD
          ref: values

      destination:
        # Cluster comes from the generator, not from config.yaml.
        name: "{{.name}}"
        namespace: "{{.namespace}}"

      # No `automated` block: prod syncs are triggered by a human or a pipeline,
      # per cluster, so a bad release can be stopped after the first one.
      # Drift still shows up as OutOfSync in the UI.
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

      revisionHistoryLimit: 10
