# Registers the shared Gateway in prod. Like every other app here it names no
# cluster — the ApplicationSet deploys one Gateway per cluster labelled env=prod,
# and each picks up its own static IP from overrides-<region>.yaml.
#
# Namespace matches the apps it fronts: the Gateway's only listener allows routes
# from the same namespace, so `demo` keeps the HTTPRoutes attachable without a
# ReferenceGrant.
app: gateway
env: prod
chartPath: helm/gateway
namespace: demo
argoProject: apps-prod
