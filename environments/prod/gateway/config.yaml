# Registers the shared Gateway in prod, one per cluster labelled env=prod.
# Namespace matches the apps it fronts: the listener only allows routes from the
# same namespace, so `demo` keeps HTTPRoutes attachable without a ReferenceGrant.
app: gateway
env: prod
chartPath: helm/gateway
namespace: demo
argoProject: apps-prod
# Synced by hand: no canary sits in front of the cluster's entry point.
autoSync: false
