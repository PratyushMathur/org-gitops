# India (asia-south1) — prod clusters labelled region=in.
# Layered over helm/company/values.yaml. Helm replaces lists, so hostnames are
# written out in full; maps like config merge.

# Stamped on every row the service writes, so a company added here stays
# attributable when it is read back from the US.
config:
  REGION: asia-south1
  CLUSTER: cluster-a

# pynd.dev is unregistered and answers NXDOMAIN; it stays so nothing needs
# rewriting the day someone buys it. The sslip.io name works today — it resolves
# to the IP spelled out in it, with no DNS zone. That hard-codes the reserved
# address `api-ind`, so this line has to change if Terraform recreates it.
httpRoute:
  hostnames:
    - api-ind.pynd.dev
    - api-ind.34.93.125.151.sslip.io

# Written by org-apps CI on every push to main (short commit sha). Overrides the
# chart's image.tag, which will therefore read older than what is deployed.
image:
  tag: "8ae0ec5"
