# US (us-central1) — applied to any prod cluster labelled region=us.
#
# Layered on top of helm/company/values.yaml. Helm replaces lists, so
# httpRoute.hostnames is written out in full. Maps like config merge.

config:
  REGION: us-central1
  CLUSTER: cluster-b

# See overrides-in.yaml, including why there is a second, uglier name and what
# hard-coding the address in it gives up. `api-us` is this region's reserved
# address.
httpRoute:
  hostnames:
    - api-us.pynd.dev
    - api-us.34.72.1.107.sslip.io

# Same release, walked more cautiously here. India opens at 20%; the US starts at
# 5% and adds a step, so a regression has two chances to be caught before the
# larger region carries half the traffic. Rolling a release out one region at a
# time is exactly why this file exists.
#
# Helm replaces lists, so the whole step list is restated rather than patched.
rollout:
  steps:
    - setWeight: 5
    - pause: {}
    - setWeight: 20
    - pause: {}
    - setWeight: 50
    - pause: {}
