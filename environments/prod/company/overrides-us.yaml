# US (us-central1) — prod clusters labelled region=us.
# Layered over helm/company/values.yaml. Helm replaces lists, so hostnames and
# rollout.steps are written out in full; maps like config merge.

config:
  REGION: us-central1
  CLUSTER: cluster-b

# See overrides-in.yaml. `api-us` is this region's reserved address.
httpRoute:
  hostnames:
    - api-us.pynd.dev
    - api-us.34.72.1.107.sslip.io

# Slower than India's 20/50, so a regression has two chances to be caught before
# the larger region carries half the traffic.
rollout:
  steps:
    - setWeight: 5
    - pause: {}
    - setWeight: 20
    - pause: {}
    - setWeight: 50
    - pause: {}

# Written by org-apps CI on every push to main (short commit sha), same tag as
# overrides-in.yaml in the same commit.
image:
  tag: "8ae0ec5"
