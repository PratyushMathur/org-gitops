# US (us-central1) — prod clusters labelled region=us.
# Layered over helm/company/values.yaml. Helm replaces lists, so hostnames and
# rollout.steps are written out in full; maps like config merge.

config:
  REGION: us-central1
  CLUSTER: cluster-b

# See overrides-in.yaml. `api-us` is this region's reserved address.
httpRoute:
  hostnames:
    - api-us.pynd.dev
    - api-us.34.72.1.107.sslip.io

# No rollout.steps override. This region used to run a longer 5/20/50 ladder than
# India's 20/50 so a regression had more chances to be caught, but the ladder is
# also the list of weights the canary console can select, and an asymmetric one
# meant an operator saw different buttons depending on which region's console they
# had open. Both regions now share the ladder in helm/company/values.yaml.
#
# The US is still held back — but by the operator promoting India first and leaving
# this region parked, which is a per-release decision, rather than by a difference
# in git that applies to every release whether or not it is wanted.

# Written by org-apps CI on every push to main (short commit sha), same tag as
# overrides-in.yaml in the same commit.
image:
  tag: "87d4091"
