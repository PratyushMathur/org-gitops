# prod overrides for canary-app.
#
# Applied to EVERY cluster labelled env=prod (currently cluster-a and cluster-b),
# so the numbers below are per-cluster: 3 replicas here means 6 running in prod.
#
# Settings that differ by cluster live in values-cluster-a.yaml and
# values-cluster-b.yaml next to this file. The ApplicationSet layers the one
# matching the target cluster on top, and ignores it when absent.

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  maxUnavailable: 1

# Spread across zones; keep the pod schedulable if a zone is already full.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: canary-app
        app.kubernetes.io/instance: canary-app

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: canary.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: canary-app-tls
      hosts:
        - canary.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  LOG_LEVEL: warn
  ENVIRONMENT: prod
