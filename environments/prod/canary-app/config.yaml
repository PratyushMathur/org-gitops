# Consumed by the apps-prod ApplicationSet git files generator.
# No cluster here on purpose - the ApplicationSet fans this out to every cluster
# labelled env=prod. This file says *what* runs, not *where*.
app: canary-app
env: prod
chartPath: helm/canary-app
namespace: default
# Named argoProject, not project: the cluster generator also emits a `project`
# parameter (empty unless the cluster Secret is project-scoped) and in a matrix
# generator it would shadow this value.
argoProject: apps-prod
