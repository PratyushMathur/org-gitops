# US (us-central1) overrides for canary-app in prod.
#
# Selected by the apps-prod ApplicationSet for any prod cluster whose Secret
# carries `region=us`, and layered on top of helm/canary-app/values.yaml. Only
# settings that genuinely differ between regions belong here - anything shared
# stays in the chart's values.yaml so it cannot drift.
#
# Helm REPLACES lists rather than merging them, so ingress.hosts and ingress.tls
# are restated in full below. Maps (like config) do merge.

config:
  CLUSTER: cluster-b
  REGION: us-central1

ingress:
  hosts:
    # Shared active/active endpoint, resolved to a cluster by the global load
    # balancer. Present on both prod clusters.
    - host: demo.pynd.dev
      paths:
        - path: /
          pathType: Prefix
    # Regional endpoint, for targeted smoke tests and failover cutover.
    - host: us.demo.pynd.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: canary-app-tls
      hosts:
        - demo.pynd.dev
        - us.demo.pynd.dev
