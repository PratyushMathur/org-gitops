# India (asia-south1) — prod clusters labelled region=in.

# Shown in the header, and stamped on every audit line the console logs.
config:
  REGION: asia-south1
  CLUSTER: cluster-a
  # The other region's console. Both are VPN-only names in the hub zone, so the
  # link works from a laptop on the tunnel but not from inside this cluster —
  # the spokes are peered to the hub, not to each other.
  PEER_REGION: us-central1
  PEER_URL: http://console-us.internal

# Written by org-apps CI on every push to main that touches the console, same as
# company and employee. It has to exist as a top-level `image:` block even before
# the first automated write, because the promote job's set-image-tag.py fails
# loudly on a file without one rather than silently skipping it.
#
# The console renders a plain Deployment, not a Rollout, so a tag change here is
# an ordinary rolling update — there is no canary of the thing that drives
# canaries.
image:
  tag: "aa54887"
