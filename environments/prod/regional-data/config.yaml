# Registers the regional Redis in prod. Each cluster gets its own identical,
# independent instance, so there are no per-region overrides by design.
#
# employee resolves this by Service name, so the release must be named
# `regional-data` — the ApplicationSet takes releaseName from `app`.
app: regional-data
env: prod
chartPath: helm/regional-data
namespace: demo
argoProject: apps-prod
# Synced by hand: unattended syncs of a StatefulSet are not worth the surprise.
autoSync: false
