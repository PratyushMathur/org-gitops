# India (asia-south1) — prod clusters labelled region=in.
# Layered over helm/employee/values.yaml. Helm replaces lists, so hostnames are
# written out in full; maps like config merge.
#
# The regional Postgres and Redis URLs are deliberately absent: the Service names
# are identical in every region and resolve to that region's own server.

config:
  REGION: asia-south1
  CLUSTER: cluster-a

# Must list the same hostnames as company: an HTTPRoute only answers for the
# hostnames it names, so a name company serves and employee omits would resolve,
# reach the Gateway and 404 on /employees. See company/overrides-in.yaml for why
# the sslip.io name exists.
httpRoute:
  hostnames:
    - api-ind.pynd.dev
    - api-ind.34.93.125.151.sslip.io

# Written by org-apps CI on every push to main (short commit sha).
image:
  tag: "7.0.0"
