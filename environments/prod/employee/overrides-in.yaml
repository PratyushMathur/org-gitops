# India (asia-south1) — applied to any prod cluster labelled region=in.
#
# Layered on top of helm/employee/values.yaml. Helm replaces lists, so
# httpRoute.hostnames is written out in full. Maps like config merge.
#
# Note what isn't here: the regional Postgres and Redis URLs. They're the same
# Service names in every region and resolve to a different server in each, so
# the regional database needs no per-region configuration at all.

config:
  REGION: asia-south1
  CLUSTER: cluster-a

# Same hostnames as company in this region — the two are separated by path
# (/employees vs /companies) on the one Gateway, not by name. Both names have to
# be listed here as well for that to hold: an HTTPRoute only answers for the
# hostnames it names itself, so a name company serves and employee omits would
# resolve, reach the Gateway, and 404 on /employees alone.
#
# See company/overrides-in.yaml for why the sslip.io name exists.
httpRoute:
  hostnames:
    - api-ind.pynd.dev
    - api-ind.34.93.125.151.sslip.io

# The image this region runs, written by org-apps CI on every push to main. See
# company/overrides-in.yaml for why the tag is a commit sha, why both regions
# carry this key, and what overwrites it.
image:
  tag: "1.0.0"
