# US (us-central1) — applied to any prod cluster labelled region=us.
#
# Layered on top of helm/employee/values.yaml. Helm replaces lists, so
# httpRoute.hostnames is written out in full. Maps like config merge.

config:
  REGION: us-central1
  CLUSTER: cluster-b

# See overrides-in.yaml.
httpRoute:
  hostnames:
    - api-us.pynd.dev
    - api-us.34.72.1.107.sslip.io
