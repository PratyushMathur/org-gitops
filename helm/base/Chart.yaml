apiVersion: v2
name: base
description: >-
  Org-wide base library chart. Provides the standard Deployment, Rollout, Service,
  ServiceAccount, HTTPRoute, Gateway, HealthCheckPolicy and ConfigMap templates,
  plus the opinionated defaults every application chart inherits.
type: library
# 0.5.0 removes the Ingress, HPA, PDB and self-managed canary templates. The
# clusters front apps with the GKE Gateway and canaries are driven by Argo
# Rollouts, so all four were unreachable. `canary.*` values are gone; the
# X-Canary header rule now reads rollout.header / rollout.headerValue.
#
# 0.4.0 added `base.rollout`: rollout.enabled swaps the Deployment for an Argo
# Rollouts Rollout and hands the canary to that controller.
version: 0.5.0
keywords:
  - base
  - library
  - platform
