# regional-data — the per-region Redis.
#
# No per-region overrides by design: every cluster gets an identical release, and
# `regional-data-redis` resolves inside each cluster to that cluster's own server.
# The name is shared; the data is not.
#
# Redis stayed in-cluster on purpose — it is a cache, so one instance per cluster
# is the right shape. Postgres moved to Cloud SQL (org-infra
# `data.cloud_sql.instances.regional-*`, reached as `regional-postgres.internal`).
#
# SCOPE: review/demo — single replica, no replication, no backups, no failover.

nameOverride: ""

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  storage:
    size: 1Gi
    # Unset means the cluster's default StorageClass (standard-rwo on GKE).
    className: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

commonLabels: {}
