{{/*
The store every ExternalSecret in the cluster refers to.

ClusterSecretStore rather than a per-namespace SecretStore: one definition serves
`demo` and anything added later, and it is the reason apps-prod does not need to
grant a cluster-scoped kind — the apps only create namespaced ExternalSecrets.

No `auth` block. Omitting it makes the provider use the controller pod's ambient
credentials, which under GKE Workload Identity resolve to the Google service
account annotated on its ServiceAccount. Spelling out `auth.workloadIdentity`
instead would duplicate the cluster name and location for no gain.

external-secrets.io/v1, not v1beta1: chart 2.8.0 stops serving v1beta1.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # The CRD only exists once the upstream chart's CRDs are applied, and Argo
    # sorts by wave before kind. Without this the first sync can fail on a
    # ClusterSecretStore whose type the API server does not yet know.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectID | quote }}
