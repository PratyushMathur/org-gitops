# canary-app
#
# The single source of values for this app. Only the deltas from the org defaults
# live here; everything not listed comes from helm/base
# (templates/_defaults.tpl) - replica strategy, security contexts, revision
# history, labels, and so on.
#
# These values are production values, and they apply to EVERY environment. The
# per-environment overrides.yaml files were folded in here deliberately, so
# staging now deploys the same configuration as prod (a different namespace, from
# config.yaml, is the only difference). Settings that genuinely differ between
# regions still live in environments/prod/canary-app/overrides-<region>.yaml.

component: web
partOf: canary

image:
  repository: pmathur/canary-app
  # Quoted: unquoted 1.0 is a YAML float and renders as ":1".
  tag: "1.0"

# No `ports` or `service` block: the image's entrypoint (/canary-app) listens on
# 8080, which is already the base default, as is the http:80 -> http service
# mapping.

# The image declares `USER nonroot:nonroot` - a *name*, not a UID. The base
# defaults set runAsNonRoot: true and deliberately no runAsUser, so the kubelet
# refuses the container with "image has non-numeric user (nonroot), cannot verify
# user is non-root". Pinning the numeric id from the image's /etc/passwd
# (nonroot:x:65532:65532) is what satisfies that check.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  # Base defaults this to true. Left off until the binary is confirmed not to
  # write to its root filesystem at startup.
  readOnlyRootFilesystem: false

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# No replicaCount: base omits `replicas` entirely when autoscaling is enabled, so
# the HPA owns the count and minReplicas below is the real floor. Setting both
# only invites them to disagree.
#
# Applied per cluster: minReplicas 3 across two prod clusters is a floor of 6.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  # maxUnavailable: 1 is the base default.

# Spread across zones; keep the pod schedulable if a zone is already full.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: canary-app
        app.kubernetes.io/instance: canary-app

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # Top-level endpoint, served by every cluster. Per-cluster files add their own
  # regional hostname alongside this one.
  hosts:
    - host: demo.pynd.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: canary-app-tls
      hosts:
        - demo.pynd.dev

config:
  LOG_LEVEL: warn
  ENVIRONMENT: prod
