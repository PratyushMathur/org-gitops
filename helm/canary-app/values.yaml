# canary-app
#
# Only the deltas from the org defaults live here. Everything not listed comes
# from helm/base (templates/_defaults.tpl) - replica strategy, security
# contexts, resource requests, revision history, labels, and so on.

component: web
partOf: canary

image:
  repository: nginxinc/nginx-unprivileged
  # tag falls back to Chart.appVersion (1.27-alpine).

replicaCount: 2

# nginx-unprivileged listens on 8080 as uid 101, which matches the base
# default port and its runAsNonRoot requirement.
ports:
  - name: http
    containerPort: 8080
    protocol: TCP

service:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

securityContext:
  # Base defaults this to true. The nginx entrypoint rewrites files under
  # /etc/nginx and /tmp at startup, so this image needs a writable rootfs.
  readOnlyRootFilesystem: false

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: canary.example.local
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: false

pdb:
  enabled: false
