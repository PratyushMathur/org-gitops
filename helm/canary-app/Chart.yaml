apiVersion: v2
name: canary-app
description: Canary demo application, deployed from the base library chart.
type: application
version: 0.1.0
appVersion: "1.27-alpine"

dependencies:
  - name: base
    version: 0.3.0
    # Resolved from this repo. Argo CD's repo-server checks out the whole
    # repository and runs `helm dependency build`, so the relative path works
    # without publishing the base chart anywhere.
    repository: "file://../base"
