# gateway — the shared entry point for a cluster.
#
# Only the static IP differs per cluster, so that is the one setting in
# environments/prod/gateway/overrides-<region>.yaml. Everything else is identical
# in every region: the apps' HTTPRoutes reference this Gateway by a fixed name.

component: ingress
partOf: platform

gateway:
  enabled: true
  # Pinned, not derived from the release name: every app chart names this in
  # `httpRoute.parentRefs`, so it is part of the contract between charts.
  name: api
  # Regional, matching the per-region external IPs Terraform reserves. A global
  # ALB would need a global address and would not use these.
  className: gke-l7-regional-external-managed
  # addressName comes from the per-region overrides — api-ind / api-us.

  # TLS terminates here on a SELF-SIGNED certificate. Clients get a real
  # encrypted connection and a trust warning: `curl -k`, or an interstitial in a
  # browser. That is the honest ceiling here, not a shortcut taken for speed.
  #
  # Why no managed certificate. Certificate Manager will not issue for these
  # Gateways: they are regional, and a REGIONAL managed certificate requires DNS
  # authorization — the API refuses load balancer authorization outright with
  # "DNS authorizations must be provided". DNS authorization means writing
  # _acme-challenge TXT records into the certified domain's own zone, and there is
  # no such zone available: pynd.dev is not registered, and sslip.io is not ours.
  # Owning the IP is enough to own a *name* through sslip.io, but not enough to
  # prove control of it to a CA.
  #
  # The path to a real certificate is therefore a registered, delegated domain —
  # at which point DNS authorization works, org-infra's gateway_certs_enabled can
  # flip true, and this listener swaps certificateRefs for the certmap annotation.
  #
  # HTTP stays open alongside HTTPS rather than redirecting: the demo endpoints are
  # published as http:// URLs, and a redirect to a certificate the client does not
  # trust turns a working request into a failed one.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        # The Secret is materialised by the ExternalSecret in extraObjects below,
        # not committed here — a private key does not belong in git even when it
        # protects nothing.
        certificateRefs:
          - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: Same

# The TLS Secret the HTTPS listener references. External Secrets pulls the
# certificate and key from Secret Manager and writes a kubernetes.io/tls Secret,
# so the private key exists in the cluster and in Secret Manager and nowhere else
# — in particular not in this repository.
#
# `gateway-tls-crt` and `gateway-tls-key` are created out of band rather than by
# Terraform. Generating them in the platform layer would need the External Secrets
# service account to grant access to, and that account is created in the data
# layer, which applies *after* platform — so wiring it there would invert the
# layer order for one demo certificate. See docs/gateway-tls.md for the two
# commands that create them.
#
# refreshInterval is long because a self-signed certificate changes only when
# somebody regenerates it. Rotating means adding a new Secret Manager version;
# the controller picks it up on the next refresh, and the Gateway reloads without
# a restart.
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: gateway-tls
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: gcp-secret-manager
        kind: ClusterSecretStore
      target:
        name: gateway-tls
        creationPolicy: Owner
        template:
          # kubernetes.io/tls is required by the Gateway API: a listener's
          # certificateRef will not accept an Opaque Secret, and the failure shows
          # up as a listener condition rather than a sync error.
          type: kubernetes.io/tls
          engineVersion: v2
          data:
            tls.crt: "{{ `{{ .crt }}` }}"
            tls.key: "{{ `{{ .key }}` }}"
      data:
        - secretKey: crt
          remoteRef:
            key: gateway-tls-crt
        - secretKey: key
          remoteRef:
            key: gateway-tls-key
