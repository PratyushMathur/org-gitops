# employee — the regional service.
#
# Only the differences from the org defaults are listed; everything else comes
# from helm/base. What changes per region lives in
# environments/prod/employee/overrides-<region>.yaml.

component: api
partOf: demo

image:
  repository: us-docker.pkg.dev/fynd-project-trial/apps/employee
  # Overridden per region by CI; this is only the fallback.
  tag: "1.0.0"

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

# See helm/company/values.yaml — Flask writes .pyc files.
securityContext:
  readOnlyRootFilesystem: false

env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

envFrom:
  - secretRef:
      name: employee-db

config:
  # The company service in THIS cluster, so the global lookup is genuinely made
  # from this region. In-cluster traffic always reaches the stable pods.
  COMPANY_API_URL: "http://company"

# DEMO PASSWORD in git — see helm/company/values.yaml.
#
# `regional-postgres.internal` is this region's own Cloud SQL instance. The name
# exists only in the spoke's own `internal.` zone and answers with a PSC endpoint
# in that same VPC, so it is a different server in each region — which is what
# makes this tier regional, as against global-postgres.internal.
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: employee-db
    type: Opaque
    stringData:
      REGIONAL_POSTGRES_URL: "postgresql://app:demo@regional-postgres.internal:5432/employee"
      REGIONAL_REDIS_URL: "redis://regional-data-redis:6379/0"

livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20

# No raised timeout here, unlike company: this service reaches an in-region
# instance, so the probe does not cross a continent.
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 10

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

replicaCount: 2

# See helm/company/values.yaml — same arrangement, different path prefix. Both
# apps share one Gateway and one hostname per region, so /employees is what
# separates this service from /companies.
httpRoute:
  enabled: true
  parentRefs:
    - name: api
      sectionName: http
  # hostnames come from environments/prod/employee/overrides-<region>.yaml
  paths:
    - path: /employees
      pathType: PathPrefix
      servicePort: http

# Coarser steps than company: employee is the regional service, so a bad release
# is already contained to one region.
rollout:
  enabled: true
  steps:
    - setWeight: 50
    - pause: {}
