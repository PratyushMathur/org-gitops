# employee — the regional service.
#
# Only the differences from the org defaults are listed; everything else comes
# from helm/base. What changes per region lives in
# environments/prod/employee/overrides-<region>.yaml.

component: api
partOf: demo

image:
  repository: us-docker.pkg.dev/fynd-project-trial/apps/employee
  # Overridden per region by CI; this is only the fallback.
  tag: "1.0.0"

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

# See helm/company/values.yaml — Flask writes .pyc files.
securityContext:
  readOnlyRootFilesystem: false

env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

envFrom:
  - secretRef:
      name: employee-db

config:
  # The company service in THIS cluster, so the global lookup is genuinely made
  # from this region. In-cluster traffic always reaches the stable pods.
  COMPANY_API_URL: "http://company"

# The database credential, synced from GCP Secret Manager by External Secrets —
# see helm/company/values.yaml for the escaping and why host/user/database stay
# here.
#
# REGIONAL_REDIS_URL is carried too even though it holds no password: ESO owns this
# whole Secret, and the app does os.environ["REGIONAL_REDIS_URL"], so a key left
# out here is a crash rather than a default.
#
# `regional-postgres.internal` is this region's own Cloud SQL instance. The name
# exists only in the spoke's own `internal.` zone and answers with a PSC endpoint in
# that same VPC, so it is a different server in each region — which is what makes
# this tier regional, as against global-postgres.internal.
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: employee-db
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: gcp-secret-manager
        kind: ClusterSecretStore
      target:
        name: employee-db
        creationPolicy: Owner
        template:
          engineVersion: v2
          data:
            REGIONAL_POSTGRES_URL: "postgresql://app:{{ `{{ .password }}` }}@regional-postgres.internal:5432/employee"
            REGIONAL_REDIS_URL: "redis://regional-data-redis:6379/0"
      data:
        - secretKey: password
          remoteRef:
            key: db-app-password

livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20

# No raised timeout here, unlike company: this service reaches an in-region
# instance, so the probe does not cross a continent.
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 10

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

replicaCount: 2

# See helm/company/values.yaml — same arrangement, different path prefix. Both
# apps share one Gateway and one hostname per region, so /employees is what
# separates this service from /companies.
httpRoute:
  enabled: true
  parentRefs:
    - name: api
      sectionName: http
  # hostnames come from environments/prod/employee/overrides-<region>.yaml
  paths:
    - path: /employees
      pathType: PathPrefix
      servicePort: http

# The same ladder as company, and the same in both regions. employee is the
# regional service, so a bad release is already contained to one region and a
# coarser ladder would be defensible — but the rungs are the set of weights the
# canary console will accept, and an operator switching between the two services
# mid-incident should not find that a weight which worked for one is rejected by
# the other. Uniform beats individually optimal here.
# No trailing pause after the last rung — see helm/company/values.yaml. A trailing
# pause is fine below 100%, but after a 100 rung it parks the rollout at full
# canary weight reporting Paused with nothing left to decide, and leaves the old
# stable pods running because the rollout never completes.
rollout:
  enabled: true
  steps:
    - setWeight: 10
    - pause: {}
    - setWeight: 25
    - pause: {}
    - setWeight: 50
    - pause: {}
    - setWeight: 75
    - pause: {}
    - setWeight: 100
