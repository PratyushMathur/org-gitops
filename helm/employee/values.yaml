# employee — the regional service.
#
# Only the differences from the org defaults are listed; everything else comes
# from helm/base. What changes per region lives in
# environments/prod/employee/overrides-<region>.yaml.

component: api
partOf: demo

image:
  repository: us-docker.pkg.dev/fynd-project-trial/apps/employee
  # Overridden per region by CI; this is only the fallback.
  tag: "1.0.0"

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

# See helm/company/values.yaml — Flask writes .pyc files.
securityContext:
  readOnlyRootFilesystem: false

env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

envFrom:
  - secretRef:
      name: employee-db

config:
  # The company service in THIS cluster, so the global lookup is genuinely made
  # from this region. In-cluster traffic always reaches the stable pods.
  COMPANY_API_URL: "http://company"

# The database credential, synced from GCP Secret Manager by External Secrets —
# see helm/company/values.yaml for the escaping and why host/user/database stay
# here.
#
# REGIONAL_REDIS_URL is carried too even though it holds no password: ESO owns this
# whole Secret, and the app does os.environ["REGIONAL_REDIS_URL"], so a key left
# out here is a crash rather than a default.
#
# `regional-postgres.internal` is this region's own Cloud SQL instance. The name
# exists only in the spoke's own `internal.` zone and answers with a PSC endpoint in
# that same VPC, so it is a different server in each region — which is what makes
# this tier regional, as against global-postgres.internal.
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: employee-db
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: gcp-secret-manager
        kind: ClusterSecretStore
      target:
        name: employee-db
        creationPolicy: Owner
        template:
          engineVersion: v2
          data:
            REGIONAL_POSTGRES_URL: "postgresql://app:{{ `{{ .password }}` }}@regional-postgres.internal:5432/employee"
            REGIONAL_REDIS_URL: "redis://regional-data-redis:6379/0"
      data:
        - secretKey: password
          remoteRef:
            key: db-app-password

livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20

# No raised timeout here, unlike company: this service reaches an in-region
# instance, so the probe does not cross a continent.
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 10

# 25m, not 50m. Measured usage is 8-14m per pod under demo load, so 50m was
# 4-6x over-provisioned -- and requests, not usage, are what the scheduler packs
# against. At four replicas across two services that overcommitment filled the
# e2-medium nodes to 95-99% of allocatable CPU requests, and when a spot node was
# preempted its pods could not be rescheduled anywhere: "3 Insufficient cpu".
#
# 25m still leaves roughly double the observed peak, and doubles how many pods
# fit per node -- which matters most during a canary, when both ReplicaSets run
# at once.
resources:
  requests: { cpu: 25m, memory: 128Mi }
  limits: { memory: 256Mi }

# No standalone NEG — see helm/company/values.yaml. The global anycast ALB it fed
# was removed.
#
# If one is ever restored here, note that employee is the REGIONAL service: each
# region has its own Cloud SQL instance holding different rows, so cross-region
# failover does not degrade this service, it changes which dataset answers. A
# us-central1 client served from asia-south1 gets India's employees, with a 200.
# Unavailable is honest; wrong is not. Leaving this service out of a global LB is
# the safe default, and the real fix is replicating the tier.

# Four, matching company — see helm/company/values.yaml for why, and for the
# capacity headroom this eats during a canary.
replicaCount: 4

# See helm/company/values.yaml — same arrangement, different path prefix. Both
# apps share one Gateway and one hostname per region, so /employees is what
# separates this service from /companies.
httpRoute:
  enabled: true
  # No sectionName: the route attaches to every compatible listener on the
  # Gateway, so it serves both :80 and the :443 listener that terminates TLS.
  # Pinning it to `http` served plain HTTP only, with the HTTPS listener
  # reporting Programmed and Ready but attachedRoutes 0 — TLS that handshakes
  # and then 404s. See helm/base/templates/_defaults.tpl.
  parentRefs:
    - name: api
  # hostnames come from environments/prod/employee/overrides-<region>.yaml
  paths:
    - path: /employees
      pathType: PathPrefix
      servicePort: http

# The same ladder as company, and the same in both regions. employee is the
# regional service, so a bad release is already contained to one region and a
# coarser ladder would be defensible — but the rungs are the set of weights the
# canary console will accept, and an operator switching between the two services
# mid-incident should not find that a weight which worked for one is rejected by
# the other. Uniform beats individually optimal here.
# No trailing pause after the last rung — see helm/company/values.yaml. A trailing
# pause is fine below 100%, but after a 100 rung it parks the rollout at full
# canary weight reporting Paused with nothing left to decide, and leaves the old
# stable pods running because the rollout never completes.
rollout:
  enabled: true
  steps:
    - setWeight: 10
    - pause: {}
    - setWeight: 25
    - pause: {}
    - setWeight: 50
    - pause: {}
    - setWeight: 75
    - pause: {}
    - setWeight: 100
