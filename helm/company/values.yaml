# company — the global service.
#
# Only the differences from the org defaults are listed; everything else comes
# from helm/base. What changes per region lives in
# environments/prod/company/overrides-<region>.yaml.

component: api
partOf: demo

image:
  repository: us-docker.pkg.dev/fynd-project-trial/apps/company
  # Quoted, or YAML reads 1.0 as a float and renders ":1". Overridden per region
  # by CI, so this is only the fallback for an unlabelled cluster.
  tag: "1.0.2"

# The kubelet cannot check a username against runAsNonRoot, so the uid is pinned.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

# Flask writes .pyc files, so the base chart's read-only root is turned off.
securityContext:
  readOnlyRootFilesystem: false

env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

envFrom:
  - secretRef:
      name: company-db

config: {}

# The database credential, synced from GCP Secret Manager by External Secrets
# rather than written here. `db-app-password` is created by org-infra's data layer;
# nothing in this repo holds the value.
#
# ESO owns the resulting `company-db` Secret (creationPolicy: Owner), so every key
# the container needs must be produced here — the app does
# os.environ["GLOBAL_POSTGRES_URL"] and crashes without it.
#
# The backticks escape the inner braces: extraObjects are run through `tpl`, so an
# unescaped {{ .password }} would be resolved by Helm against the chart context
# (yielding nothing) instead of reaching ESO's own templating.
#
# Host, user and database stay in git deliberately — they are configuration, not
# secrets, and keeping them visible makes the URL reviewable.
#
# `global-postgres.internal` is the shared Cloud SQL instance (org-infra
# `data.cloud_sql.instances.global`) — one server in us-central1. The name resolves
# in every VPC through the split-horizon `internal.` zone, each answering with its
# own Private Service Connect endpoint for the same instance. Different IP per
# region, same database: that is what makes this tier global.
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: company-db
    spec:
      # The password only changes when Terraform rotates it, so an hour is ample.
      refreshInterval: 1h
      secretStoreRef:
        name: gcp-secret-manager
        kind: ClusterSecretStore
      target:
        name: company-db
        creationPolicy: Owner
        template:
          engineVersion: v2
          data:
            GLOBAL_POSTGRES_URL: "postgresql://app:{{ `{{ .password }}` }}@global-postgres.internal:5432/company"
      data:
        - secretKey: password
          remoteRef:
            key: db-app-password

# /healthz does not touch the database, so an outage will not restart every pod.
# /readyz does, so an affected pod leaves the Service instead.
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20

# timeoutSeconds is raised from the default 1: /readyz opens a fresh connection to
# Postgres in us-central1 from a pod that may be in asia-south1, and TCP + TLS +
# auth across that RTT measures ~2.6s. At the default the probe always timed out
# and the pod never went Ready despite answering 200.
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 10
  timeoutSeconds: 5

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

# No standalone NEG. One was published here so a global anycast ALB could reach
# these pods directly across both clusters; that ALB was removed, and a NEG with
# nothing attached is just an object GKE keeps in step for no reader.
#
# To put this service behind a global LB again, restore:
#
#   service:
#     annotations:
#       cloud.google.com/neg: '{"exposed_ports": {"80": {"name": "company-neg"}}}'
#
# and the matching platform.global_alb.apps entry in org-infra. The name has to
# agree on both sides — a mismatch is a Terraform apply error, not a silent 502 —
# and the NEG must exist before Terraform can attach it, so the chart change lands
# first. The regional Gateway is unaffected either way: it builds its own load
# balancer and ignores the annotation.

# Four, so a canary weight has somewhere to land: the controller scales the canary
# ReplicaSet to ceil(replicas x weight), which at two replicas rounds 10% and 25%
# to the same single pod. Four makes the low rungs distinguishable.
#
# Capacity note: a canary runs the new ReplicaSet *alongside* the old one, so the
# peak is 8 pods for this service rather than 4, and the same again for employee.
# At 50m CPU requested each that is 800m per cluster at peak against e2-medium
# nodes already at 75-99% of allocatable CPU requests. Both node pools autoscale,
# so it resolves — but pods can sit Pending for a minute or two first.
replicaCount: 4

# Fronted by the cluster's shared Gateway (helm/gateway), not an Ingress
# controller. Both regions expose one hostname, so apps are told apart by path:
# this one owns /companies. /healthz, /readyz and /version stay in-cluster.
httpRoute:
  enabled: true
  # No sectionName: the route attaches to every compatible listener on the
  # Gateway, so it serves both :80 and the :443 listener that terminates TLS.
  # Pinning it to `http` served plain HTTP only, with the HTTPS listener
  # reporting Programmed and Ready but attachedRoutes 0 — TLS that handshakes
  # and then 404s. See helm/base/templates/_defaults.tpl.
  parentRefs:
    - name: api
  # hostnames come from environments/prod/company/overrides-<region>.yaml
  paths:
    - path: /companies
      pathType: PathPrefix
      servicePort: http

# The canary is whatever image.tag becomes next; changing it and syncing starts a
# rollout. It pauses at every rung until a human advances it, with
#   kubectl argo rollouts promote company -n demo
# or the Promote button in the canary console.
#
# Both regions share this ladder. There is deliberately no per-region override:
# the ladder is the set of weights an operator can select, and an asymmetric one
# meant the same button was present in one console and missing in the other.
# What staggers a release now is the operator advancing one region and holding or
# aborting the other, which is a decision taken per release rather than a
# constant baked into git.
#
# Every rung is also a weight the canary console can select. Weight is not a spec
# field — it exists only as steps[].setWeight — so the console can only reach a
# value that appears here, and anything else needs a commit.
#
# Five rungs, deliberately. A denser ladder would let the console accept more
# typed values, but it buys precision nobody uses: the decision an operator
# actually makes is roughly "a tenth, a quarter, half, most, all", and twenty
# rungs made the Rollout spec long to read for no gain in control.
# NOTE no `pause` after the last rung. A trailing pause is fine — and is the
# base chart's default — when the last rung is below 100: parking at 50% while a
# human decides whether to finish is a real gate. After a **100** rung it is a
# trap, because there is no traffic decision left to make.
#
# What it looked like: the rollout parks at 100% canary reporting Paused, Argo
# reports the app Suspended, and because the rollout has not *completed* the
# controller correctly holds the old stable ReplicaSet at full size — that is what
# makes an abort instant. So the old pods are never recycled and it reads exactly
# like a stuck release, needing two further promotes to clear.
#
# Ending on setWeight means the rollout runs out of steps and completes on its
# own: the canary ReplicaSet becomes stable, the old one scales to zero, the phase
# goes Healthy. 100% is therefore a transition rather than a resting place —
# selecting it in the console finishes the release, and the last human decision is
# the pause at 75%.
rollout:
  enabled: true
  steps:
    - setWeight: 10
    - pause: {}
    - setWeight: 25
    - pause: {}
    - setWeight: 50
    - pause: {}
    - setWeight: 75
    - pause: {}
    - setWeight: 100
