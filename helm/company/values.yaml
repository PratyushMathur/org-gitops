# company — the global service.
#
# Only the differences from the org defaults are listed; everything else comes
# from helm/base. What changes per region lives in
# environments/prod/company/overrides-<region>.yaml.

component: api
partOf: demo

image:
  repository: us-docker.pkg.dev/fynd-project-trial/apps/company
  # Quoted, or YAML reads 1.0 as a float and renders ":1". Overridden per region
  # by CI, so this is only the fallback for an unlabelled cluster.
  tag: "1.0.2"

# The kubelet cannot check a username against runAsNonRoot, so the uid is pinned.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

# Flask writes .pyc files, so the base chart's read-only root is turned off.
securityContext:
  readOnlyRootFilesystem: false

env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

envFrom:
  - secretRef:
      name: company-db

config: {}

# DEMO PASSWORD in git. Fine for a review environment; in production set
# `extraObjects: []` and let External Secrets create a Secret of the same name.
#
# `global-postgres.internal` is the shared Cloud SQL instance (org-infra
# `data.cloud_sql.instances.global`) — one server in us-central1. The name
# resolves in every VPC through the split-horizon `internal.` zone, each
# answering with its own Private Service Connect endpoint for the same instance.
# Different IP per region, same database: that is what makes this tier global.
#
# There is no in-cluster stand-in. If pods will not go Ready, check that
# org-infra's `data.cloud_sql.enabled` is true and applied — /readyz opens a real
# connection, so an unresolvable name means no backend.
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: company-db
    type: Opaque
    stringData:
      GLOBAL_POSTGRES_URL: "postgresql://app:demo@global-postgres.internal:5432/company"

# /healthz does not touch the database, so an outage will not restart every pod.
# /readyz does, so an affected pod leaves the Service instead.
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20

# timeoutSeconds is raised from the default 1: /readyz opens a fresh connection to
# Postgres in us-central1 from a pod that may be in asia-south1, and TCP + TLS +
# auth across that RTT measures ~2.6s. At the default the probe always timed out
# and the pod never went Ready despite answering 200.
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 10
  timeoutSeconds: 5

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

replicaCount: 2

# Fronted by the cluster's shared Gateway (helm/gateway), not an Ingress
# controller. Both regions expose one hostname, so apps are told apart by path:
# this one owns /companies. /healthz, /readyz and /version stay in-cluster.
httpRoute:
  enabled: true
  parentRefs:
    - name: api
      sectionName: http
  # hostnames come from environments/prod/company/overrides-<region>.yaml
  paths:
    - path: /companies
      pathType: PathPrefix
      servicePort: http

# The canary is whatever image.tag becomes next; changing it and syncing starts a
# rollout. India leads at 20% then 50%, pausing at each until a human runs
#   kubectl argo rollouts promote company -n demo
# The US is held further back — see overrides-us.yaml.
rollout:
  enabled: true
  steps:
    - setWeight: 20
    - pause: {}
    - setWeight: 50
    - pause: {}
