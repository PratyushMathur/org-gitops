# argo-rollouts — the progressive-delivery controller.
#
# Everything here is passed through to the upstream chart under its own key. This
# file holds only what differs from its defaults.

argo-rollouts:
  # The CRDs are the API the app charts render against, so the controller owns
  # them. keepCRDs means uninstalling it does not delete every Rollout object.
  installCRDs: true
  keepCRDs: true
  clusterInstall: true

  controller:
    # Gateway API support lives out-of-tree in argoproj-labs, so it is a plugin.
    # The controller downloads the binary at startup and will not go ready without
    # egress to github.com. Pinned: `latest` would let a restart silently change
    # how traffic is shifted.
    #
    # The name must match the key the Rollout's trafficRouting.plugins map uses,
    # which the plugin defines as `argoproj-labs/gatewayAPI`.
    trafficRouterPlugins:
      - name: "argoproj-labs/gatewayAPI"
        location: "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.16.0/gatewayapi-plugin-linux-amd64"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  # The canary control portal, off by default upstream. On so promoting or aborting
  # a canary does not require kubectl and cluster credentials. Reached over the
  # WireGuard VPN only (org-infra docs/wireguard-vpn.md).
  dashboard:
    enabled: true

    # readonly would deny every mutating verb, leaving a viewer rather than a
    # control portal. The dashboard has no authentication of its own, so VPN
    # membership is the entire access control — keep the peer list short.
    readonly: false

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    service:
      # Stays ClusterIP: a Terraform-owned internal ALB reaches these pods through
      # a standalone NEG. The port must be the dashboard's service port (3100) and
      # the NEG name must match data.canary_portal.neg_name in org-infra, or
      # Terraform fails at apply against a NEG that never appears.
      annotations:
        cloud.google.com/neg: '{"exposed_ports": {"3100": {"name": "rollouts-dashboard-neg"}}}'

# The ServiceAccount the upstream subchart creates, which the Gateway API plugin's
# ClusterRoleBinding attaches to. Restated rather than computed: a wrong named
# value fails loudly at apply, where a cross-chart template call would quietly bind
# to nothing.
controllerServiceAccount: argo-rollouts
