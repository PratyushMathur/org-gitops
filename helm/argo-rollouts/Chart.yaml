apiVersion: v2
name: argo-rollouts
description: >-
  The Argo Rollouts controller, plus the Gateway API traffic-router plugin and
  the RBAC that plugin needs. A thin wrapper around the upstream chart so the
  controller is installed the same way as everything else: from this repo,
  through Argo CD.
type: application
version: 0.1.0
appVersion: "1.9.1"

# No dependency on helm/base — that library renders an application's
# Deployment/Service/HPA set, and this chart installs a controller.
dependencies:
  - name: argo-rollouts
    version: 2.41.1
    repository: https://argoproj.github.io/argo-helm
